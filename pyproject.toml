[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosystem-complexity"
version = "0.1.0"
description = "An inference-first approach to understanding the Carbon Cycle."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Newton Nguyen", email = "nnewton@stanford.edu" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jax>=0.4.30",
    "optax>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "N", "T"]
ignore = [
    "E203",
    # Scientific naming conventions conflict with PEP-8 lowercase rules.
    # Names like C12, C14, log_Q10, lambda_14C, GPP, CUE, Ra, T_ref,
    # step_12C, step_14C, _step_12C_pure are domain-standard (TECHSPEC) —
    # renaming them would reduce clarity.
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N806",   # Variable in function should be lowercase
    "N815",   # Variable in class scope should not be mixedCase
    "N999",   # Module name contains numerals (tracer_14C, parsers_14C, test_14C)
]

[tool.ruff.lint.per-file-ignores]
# Scaffold files whose names contain numerals — unavoidable in this domain.
"src/ecosystem_complexity/tracer_14C.py" = ["N999"]
"src/ecosystem_complexity/data/parsers_14C.py" = ["N999"]
"tests/test_14C.py" = ["N999"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"
testpaths = ["tests"]
