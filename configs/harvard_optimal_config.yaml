site:
  id: US-Ha1-2pool
  name: "Harvard Forest \u2013 2-Pool Optimal (active + passive)"
  lat: 42.54
  lon: -72.17
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 300
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: soil
    depth_top_m: 0.0
    depth_bot_m: 0.6
    permafrost_eligible: false
    som_pools:
    - name: active
      tau_prior_days: 730
      tau_prior_std: 365
    - name: passive
      tau_prior_days: 36500
      tau_prior_std: 18250
  transfer_rules:
  - - soil_active
    - soil_passive
    - 0.25
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    soil_active: 0.85
    soil_passive: 0.15
  optimize_partition: true
parameters:
  alloc: {}
  Q10: 2.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  optimizer: adam
  learning_rate: 0.0003
  max_iterations: 1000
  weight_flux: 0.0
  weight_14C: 1.0
  weight_resp_14C: 1.0
  weight_carbon: 1.0
  grad_clip: 1.0
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
