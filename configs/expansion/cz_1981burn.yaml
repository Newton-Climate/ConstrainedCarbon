# Generated from notebooks/exports/incubation_config_manifest_20260719.csv
# on 2026-07-19. Update the manifest and rerun this script to refresh.
site:
  id: israd-expansion-cz_1981burn
  name: CZ 1981 Burn (CA-NS5)
  lat: 55.864
  lon: -98.484
  biome: boreal burned forest permafrost
  tower_id: CA-NS5
  mat_c: -3.2
  map_mm: 510.0
  elevation_m: 250.0
datasource:
  israd_name: CZ_1981burn
  forcing_glob: AMF_CA-NS5_*
  forcing_kind: daily
  observation_path: bulk_resp
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 400
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: soil
    depth_top_m: 0.0
    depth_bot_m: 1.3
    permafrost_eligible: false
    som_pools:
    - name: active
      depth_top_m: 0.0
      depth_bot_m: 0.1
      tau_prior_days: 730
      tau_prior_std: 365
    - name: slow
      depth_top_m: 0.1
      depth_bot_m: 0.3
      tau_prior_days: 7300
      tau_prior_std: 3650
    - name: passive
      depth_top_m: 0.3
      depth_bot_m: 1.3
      tau_prior_days: 73000
      tau_prior_std: 36500
  transfer_rules:
  - - soil_active
    - soil_slow
    - 0.25
  - - soil_slow
    - soil_passive
    - 0.1
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    soil_active: 1.0
    soil_slow: 0.0
  optimize_partition: false
parameters:
  alloc: {}
  Q10: 2.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  sigma_soc_fraction: 0.5
  oe_max_iterations: 100
  sigma_pool_14C: 15.0
  sigma_resp_14C: 15.0
  sigma_carbon_gCm2: 1500.0
  f_hetero: 0.55
  sigma_f_hetero: 0.08
  sigma_er_frac: 0.15
  lm_lambda0: 0.01
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: true
    ablation: true
    orthogonality: true
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/expansion/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
