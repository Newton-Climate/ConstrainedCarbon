site:
  id: US-Ha1-soil
  name: "Harvard Forest \u2013 Soil Only (prescribed GPP input)"
  lat: 42.54
  lon: -72.17
datasource:
  israd_name: Harvard Forest
  forcing_glob: AMF_US-Ha1_FLUXNET_1991-2025_v1.3_r1
  forcing_kind: daily
  observation_path: combined
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 300
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: organic
    depth_top_m: 0.0
    depth_bot_m: 0.05
    permafrost_eligible: false
    som_pools:
    - name: litter
      tau_prior_days: 1732
      tau_prior_std: 600
    - name: fast
      tau_prior_days: 7425
      tau_prior_std: 2500
  - name: mineral_A
    depth_top_m: 0.05
    depth_bot_m: 0.2
    permafrost_eligible: false
    som_pools:
    - name: fast
      tau_prior_days: 2513
      tau_prior_std: 800
    - name: slow
      tau_prior_days: 12434
      tau_prior_std: 4000
  - name: mineral_B
    depth_top_m: 0.2
    depth_bot_m: 0.6
    permafrost_eligible: false
    som_pools:
    - name: slow
      tau_prior_days: 27375
      tau_prior_std: 10000
    - name: passive
      tau_prior_days: 109500
      tau_prior_std: 40000
  transfer_rules:
  - - organic_litter
    - organic_fast
    - 0.35
  - - organic_litter
    - mineral_A_fast
    - 0.15
  - - organic_fast
    - mineral_A_fast
    - 0.2
  - - organic_fast
    - mineral_A_slow
    - 0.05
  - - mineral_A_fast
    - mineral_A_slow
    - 0.12
  - - mineral_A_slow
    - mineral_B_slow
    - 0.03
  - - mineral_A_slow
    - mineral_B_passive
    - 0.01
  - - mineral_B_slow
    - mineral_B_passive
    - 0.01
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    organic_litter: 0.45
    mineral_A_fast: 0.35
    mineral_A_slow: 0.15
    mineral_B_slow: 0.05
  optimize_partition: true
parameters:
  alloc: {}
  Q10: 2.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  optimizer: adam
  learning_rate: 0.0003
  max_iterations: 800
  weight_flux: 0.0
  weight_14C: 1.0
  weight_resp_14C: 1.0
  grad_clip: 1.0
  oe_max_iterations: 40
  sigma_pool_14C: 5.0
  sigma_resp_14C: 10.0
  lm_lambda0: 0.001
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true

