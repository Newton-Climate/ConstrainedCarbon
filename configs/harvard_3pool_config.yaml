site:
  id: US-Ha1-3pool
  name: "Harvard Forest \u2013 3-Pool Optimal (active + slow + passive)"
  lat: 42.54
  lon: -72.17
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 300
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: soil
    depth_top_m: 0.0
    depth_bot_m: 0.6
    permafrost_eligible: false
    som_pools:
    - name: active
      tau_prior_days: 730
      tau_prior_std: 365
    - name: slow
      tau_prior_days: 7300
      tau_prior_std: 3000
    - name: passive
      tau_prior_days: 36500
      tau_prior_std: 18250
  transfer_rules:
  - - soil_active
    - soil_slow
    - 0.25
  - - soil_slow
    - soil_passive
    - 0.1
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    soil_active: 1.0
    soil_slow: 0.0
  optimize_partition: false
parameters:
  alloc: {}
  Q10: 2.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  oe_max_iterations: 50
  sigma_pool_14C: 10.0
  sigma_resp_14C: 15.0
  sigma_carbon_gCm2: 500.0
  f_hetero: 0.55
  sigma_f_hetero: 0.08
  sigma_er_frac: 0.15
  lm_lambda0: 0.01
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
