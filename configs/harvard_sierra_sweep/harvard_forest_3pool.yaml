site:
  id: harvard-3pool-combined
  name: Harvard Forest — 3-pool, combined obs path
  lat: 42.5378
  lon: -72.1715
  tower_id: US-Ha1
  biome: temperate deciduous forest
datasource:
  israd_name: Harvard Forest
  forcing_glob: AMF_US-Ha1_FLUXNET_1991-2025_v1.3_r1
  forcing_kind: daily
  observation_path: combined
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 400
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: soil
    depth_top_m: 0.0
    depth_bot_m: 1.3
    permafrost_eligible: false
    som_pools:
    - name: active
      depth_top_m: 0.0
      depth_bot_m: 0.1
      tau_prior_days: 730
      tau_prior_std: 365
    - name: slow
      depth_top_m: 0.1
      depth_bot_m: 0.3
      tau_prior_days: 7300
      tau_prior_std: 3650
    - name: passive
      depth_top_m: 0.3
      depth_bot_m: 1.3
      tau_prior_days: 73000
      tau_prior_std: 36500
  transfer_rules:
  - - soil_active
    - soil_slow
    - 0.25
  - - soil_slow
    - soil_passive
    - 0.1
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    soil_active: 1.0
    soil_slow: 0.0
  optimize_partition: false
parameters:
  alloc: {}
  Q10: 2.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  sigma_soc_fraction: 0.5
  oe_max_iterations: 100
  sigma_pool_14C: 15.0
  sigma_resp_14C: 15.0
  sigma_carbon_gCm2: 1500.0
  f_hetero: 0.55
  sigma_f_hetero: 0.08
  sigma_er_frac: 0.15
  lm_lambda0: 0.01
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
