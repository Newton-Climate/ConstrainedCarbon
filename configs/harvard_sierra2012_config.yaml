site:
  id: US-Ha1-Sierra2012
  name: "Harvard Forest \u2013 Gaudinski/Sierra 2012 7-pool forward simulation"
  lat: 42.54
  lon: -72.17
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 0
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools:
  - name: dead_roots
    is_woody: false
    litterfall_to: organic_Oi
  soil_layers:
  - name: organic
    depth_top_m: 0.0
    depth_bot_m: 0.08
    permafrost_eligible: false
    som_pools:
    - name: Oi
      tau_prior_days: 547
      tau_prior_std: 183
    - name: Oe_a_L
      tau_prior_days: 1460
      tau_prior_std: 547
    - name: Oe_a_H
      tau_prior_days: 12775
      tau_prior_std: 3650
  - name: mineral
    depth_top_m: 0.08
    depth_bot_m: 0.15
    permafrost_eligible: false
    som_pools:
    - name: ALF_gt80
      tau_prior_days: 1095
      tau_prior_std: 365
    - name: ALF_lt80
      tau_prior_days: 27375
      tau_prior_std: 9125
    - name: MinAss
      tau_prior_days: 40150
      tau_prior_std: 13150
  transfer_rules:
  - - dead_roots
    - organic_Oi
    - 0.538
  - - dead_roots
    - mineral_ALF_gt80
    - 0.462
  - - organic_Oi
    - organic_Oe_a_L
    - 0.658
  - - organic_Oe_a_L
    - organic_Oe_a_H
    - 0.041
  - - mineral_ALF_gt80
    - mineral_ALF_lt80
    - 0.8
  - - mineral_ALF_lt80
    - mineral_MinAss
    - 0.098
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.47
  optimize_CUE: false
  soil_input_fraction: 0.7015
  optimize_soil_input_fraction: false
  partition:
    organic_Oi: 0.9823
    organic_Oe_a_L: 0.0
    organic_Oe_a_H: 0.0
    mineral_ALF_gt80: 0.0
    mineral_ALF_lt80: 0.0
    mineral_MinAss: 0.0177
  optimize_partition: false
parameters:
  alloc:
    dead_roots: 1.0
  tau_overrides:
    dead_roots: 2190
  Q10: 1.0
  theta_opt: 0.35
  gamma_moisture: 5.0
inversion:
  oe_max_iterations: 30
  sigma_pool_14C: 25.0
  sigma_resp_14C: 20.0
  sigma_carbon_gCm2: 400.0
  lm_lambda0: 0.01
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
