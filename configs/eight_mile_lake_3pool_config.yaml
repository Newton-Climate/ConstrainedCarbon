site:
  id: US-EML-3pool
  name: "Eight-mile Lake, Alaska \u2013 3-Pool Optimal"
  lat: 63.8784
  lon: -149.2536
  T_annual_mean_C: -2.0
model:
  dt_days: 1.0
  solver: euler
  spinup_years: 500
  enable_14C: true
  microbial_pool_per_layer: false
  aboveground_pools: []
  soil_layers:
  - name: soil
    depth_top_m: 0.0
    depth_bot_m: 1.0
    permafrost_eligible: true
    som_pools:
    - name: active
      depth_top_m: 0.0
      depth_bot_m: 0.2
      tau_prior_days: 1095
      tau_prior_std: 547
    - name: slow
      depth_top_m: 0.2
      depth_bot_m: 0.5
      tau_prior_days: 18250
      tau_prior_std: 9125
    - name: passive
      depth_top_m: 0.5
      depth_bot_m: 1.0
      tau_prior_days: 292000
      tau_prior_std: 146000
  transfer_rules:
  - - soil_active
    - soil_slow
    - 0.2
  - - soil_slow
    - soil_passive
    - 0.05
external_inputs:
  enabled: true
  source: GPP_obs
  CUE: 0.35
  optimize_CUE: false
  soil_input_fraction: 1.0
  optimize_soil_input_fraction: false
  partition:
    soil_active: 1.0
    soil_slow: 0.0
  optimize_partition: false
parameters:
  alloc: {}
  Q10: 2.5
  theta_opt: 0.45
  gamma_moisture: 3.0
inversion:
  oe_max_iterations: 200
  sigma_pool_14C: 35.0
  sigma_resp_14C: 20.0
  sigma_carbon_gCm2: 4000.0
  f_hetero: 0.8
  sigma_f_hetero: 0.1
  sigma_er_frac: 0.2
  lm_lambda0: 0.01
  lm_lambda_factor: 10.0
  oe_convergence_eps: 0.0001
analysis:
  metrics:
    reduced_chi2: true
    rmse: true
    degrees_of_freedom: true
    averaging_kernel: true
    gain_matrix: true
    jacobian: true
    constraint_ladder: true
    shapley: false
    ablation: false
    orthogonality: false
  plots:
    model_results: true
    information_content: true
    observation_fit: true
output:
  artifact_dir: results/{config_stem}
  summary_json: true
  matrices_npz: true
  observation_csv: true
  diagnostics_csv: true
  figure_png: true
