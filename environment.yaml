name: ecosystem-complexity
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  # Differentiable modelling / inversion
  - jax
  - optax
  # Dev tools
  - pytest
  - pytest-cov
  - black
  - ruff
  - mypy
  - pip:
      - -r requirements.txt
